# Tasks web app - https://task.firdovsirzaev.online -> fr-task-web on 127.0.0.1:6071
#
# Installed by deploy/vps-setup.sh (in the backend repo) into /etc/nginx/sites-available/.
# It starts as plain HTTP; `certbot --nginx` then adds the 443 server and the HTTP -> HTTPS
# redirect to this same file. The app proxies /api/* to the API itself, over the docker network.

# Sign-in goes through the app's /api proxy, so it is limited here as well as on api-task.
limit_req_zone $binary_remote_addr zone=fr_task_app_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name task.firdovsirzaev.online;

    client_max_body_size 10m;

    location = /api/auth/login {
        limit_req zone=fr_task_app_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:6071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:6071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
